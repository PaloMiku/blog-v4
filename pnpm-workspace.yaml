# pnpm workspace（Astro 7 接管仓库根之后，站点根就是 workspace 根）
#
# 2026-10-03 之前这里是 Nuxt 4 的 workspace：五个 catalog 组装着 nuxt / @nuxt/content /
# vue-tippy / postcss-nesting 之类的版本，patchedDependencies 里有四个 Nuxt 专用补丁
# （@nuxt/image、@nuxtjs/mdc、ipx、plain-shiki），overrides 把 ipx 钉到 4.0.0-beta.1。
# 那棵树连同 astro-site/ 各自的第二套 workspace 文件一起退役了。
#
# 现在只保留 catalogs 这一个约定：**package.json 里全是 `catalog:` 引用，版本只在这里
# 出现一次**。分组沿用原来的五个名字（content / framework / quality / ui / util），
# 便于对照旧 diff；条目按当前实装版本写 caret，基线就是被门禁量过的那一版。
#
# 删 catalogs 之前先问一句：这个版本是不是只出现在这一个文件里。答案是「是」的时候，
# `catalog:` 引用换来的是「改一处」，代价是读 package.json 的人看不到版本。

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  oxc-resolver: true
  rolldown: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  content:
    '@astrojs/markdown-remark': ^7.3.1
    '@astrojs/mdx': ^8.0.2
    '@mdx-js/mdx': ^3.1.1
    '@shikijs/colorized-brackets': ^4.4.3
    '@shikijs/transformers': ^4.4.3
    abcjs: ^6.7.1
    mermaid: ^11.17.2
    rehype-katex: ^7.0.1
    remark-gfm: ^4.0.1
    remark-math: ^6.0.0
    remark-mdc: ^3.11.1
    shiki: ^4.4.3
  framework:
    '@astrojs/sitemap': ^3.7.4
    astro: ^7.3.5
    astro-icon: 1.2.0
    github-slugger: ^2.0.0
    temporal-polyfill: ^1.0.5
  quality:
    '@antfu/eslint-config': ^9.5.1
    '@clack/prompts': ^1.7.0
    '@types/node': ^24.19.0
    '@zinkawaii/eslint-config-css': ^0.5.4
    cspell: ^10.2.2
    eslint: ^10.10.0
    p-limit: ^7.3.2
    strip-ansi: ^7.2.0
    typescript: ^6.0.3
    yaml: ^2.9.1
  ui:
    '@astrojs/vue': ^7.0.3
    '@iconify-json/catppuccin': ^1.2.17
    '@iconify-json/devicon': ^1.2.68
    '@iconify-json/icon-park-outline': ^1.2.4
    '@iconify-json/icon-park-solid': ^1.2.4
    '@iconify-json/line-md': ^1.2.16
    '@iconify-json/material-symbols': ^1.2.93
    '@iconify-json/ri': ^1.2.10
    '@iconify-json/simple-icons': ^1.2.98
    '@iconify-json/tabler': ^1.2.41
    '@iconify-json/uim': ^1.2.3
    embla-carousel: ^8.6.0
    embla-carousel-autoplay: ^8.6.0
    embla-carousel-wheel-gestures: ^8.1.0
    vue: ^3.5.43
  util:
    es-toolkit: ^1.52.0
    fast-xml-builder: ^1.3.1
    minisearch: ^7.2.0
    parse-domain: 8.4.0
    reading-time: ^1.5.0
    unist-util-visit: ^5.1.0

engineStrict: true

shamefullyHoist: true
