# Build and Deploy
#
# 唯一的部署流水线。2026-10-03 起 Astro 接管仓库根（`src/` `public/` `astro.config.mjs`
# 都在根），Nuxt 流水线与其源码树一并退役——`build-astro.yml` 的「双轨、只手动触发」
# 前提已不成立，那是为了「先不切断现役流水线」而存在的过渡设计。
#
# push main 即发布。若想先看构建结果再发，把 on.push 去掉、只留 workflow_dispatch。
#
# 验收由 `node scripts/accept.mjs --skip-build` 一条命令跑完，与本地默认档
# **同一份门禁名单**（就在 scripts/accept.mjs 里）。2026-10-04 之前这里是 13 个
# 手抄的步骤，那份手抄清单已经漂过：本地新增的门禁没同步过来，抓到真缺陷最多的
# check-affordances 就只在本地跑；而 PowerShell 门禁在 ubuntu runner 上结构上跑
# 不起来，那 10 道只能永远缺席。全部迁到 node 之后这两种漂移都从结构上消失了。
#
# 门禁名单不在这个文件里，所以这里也就不再复述成员——复述就是第二份真相，
# 而第二份真相已经错过好几次（见 CLAUDE.md 坑位 37）。
#
# 依赖未入库的 Nuxt 冻结基线（`baseline/nuxt/`）的门禁在 CI 上会自己跳过并在
# 汇总里单列成 `skipped`，不计入通过。

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PNPM_VERSION: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      # 站点根就是仓库根，pnpm 版本从根 package.json 的 packageManager 读。
      - name: Read pnpm version
        id: pnpm-version
        run: |
          PNPM_VERSION=$(node -p "(require('./package.json').packageManager || '').split('@')[1] || ''")
          if [ -z "$PNPM_VERSION" ]; then
            echo "No pnpm version found in package.json.packageManager, fallback to latest"
            PNPM_VERSION=latest
          fi
          echo "PNPM_VERSION=$PNPM_VERSION" >> $GITHUB_ENV

      # engines: node ^22.19 || ^24.11 || >=26。`node-version: 24` 取最新 24.x，满足 ^24.11。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # --frozen-lockfile 是这一行的全部意义：它是「提交的 lockfile 仍与 package.json
      # 一致」这项检查。去掉它，一个漂移的 lockfile 会静默装上没人审过的东西。
      # 根 .gitignore 里有 baseline/，所以 Nuxt 冻结基线不在 checkout 里——
      # 依赖它的 7 道离线门禁只能本地跑，这个 skip 是有意的。
      - name: Install dependencies with pnpm
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        run: pnpm typecheck

      # 构建日志 tee 到 accept.mjs 约定的那条路径，这样零告警构建检查
      # （check-build-warnings）在 CI 里也自动获得覆盖——它自己不再构建，只读日志。
      #
      # ⚠️ `shell: bash` 不是可选的。GitHub 在 Linux 上的**默认** shell 是
      # `bash -e {0}`，**不带 pipefail** ⇒ `pnpm build | tee` 里构建失败会被
      # tee 的退出码 0 吞掉，流水线照样往下走、直接发布一个坏产物。
      # 显式写 `shell: bash` 才是 `bash --noprofile --norc -eo pipefail {0}`。
      - name: Build static files
        shell: bash
        run: pnpm build 2>&1 | tee .astro-compare/acceptance-build.log

      # 验收：一条命令跑完默认档的全部门禁。
      #
      # 2026-10-04 之前这里是 13 个手抄的 `- name: Gate: x` 步骤。抄清单的代价
      # 已经付过两次：一是清单会漂（本地加了门禁，CI 没加，于是抓到真缺陷最多的
      # check-affordances 只在本地跑）；二是 PowerShell 门禁在 ubuntu runner 上
      # 结构上跑不起来，那 10 道只能永远缺席。门禁全部迁到 node 之后，两种漂移
      # 都从结构上消失了——CI 与本地跑的是同一份名单，就在 scripts/accept.mjs 里。
      #
      # --skip-build：产物就是上面那一步 build 的，不重建。
      #
      # interaction-check.mjs 仍然不在这里：它在流水线里不可靠而单跑可靠，
      # 理由与实测数据见 docs/astro-phase1-findings.md。单跑：
      #   node scripts/interaction-check.mjs
      - name: Acceptance gates
        run: node scripts/accept.mjs --skip-build

      - name: Deploy to GitHub Public
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: dist
          repository-name: PaloMiku/blog-public
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          commit-message: Deploy build to GitHub Public Repository
          # 默认 clean:true。首次 Astro 部署正是靠它退休 blog-public 里残留的
          # _nuxt/ __nuxt_content/ __sitemap__/ _studio-app/ 与 200.html SPA 壳。
          # CNAME 例外：万一将来自定义域名是以文件形式配的，action 会把它一起删掉。
          clean-exclude: |
            CNAME
